<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1600" height="900" fill="#83b47e" />

  <!-- road: horizontal highway curving into a diagonal ramp, like the reference screenshot -->
  <path d="M -50 260 L 700 260 C 850 260 900 320 800 420 C 650 570 450 650 150 900"
        fill="none" stroke="#0a0a0a" stroke-width="132" stroke-linecap="butt" />

  <!-- lane divider -->
  <path d="M -50 260 L 700 260 C 850 260 900 320 800 420 C 650 570 450 650 150 900"
        fill="none" stroke="#f2f2f2" stroke-width="3" stroke-dasharray="22 18" opacity="0.85" />

  <!-- direction arrows on the horizontal section -->
  <polygon points="150,248 150,272 178,260" fill="#f2f2f2" />
  <polygon points="380,248 380,272 408,260" fill="#f2f2f2" />
  <polygon points="600,248 600,272 628,260" fill="#f2f2f2" />

  <!-- orange markers along the ramp -->
  <circle cx="640" cy="470" r="6" fill="#ff9933" stroke="#b56a1f" stroke-width="1.5" />
  <circle cx="470" cy="630" r="6" fill="#ff9933" stroke="#b56a1f" stroke-width="1.5" />
  <circle cx="300" cy="780" r="6" fill="#ff9933" stroke="#b56a1f" stroke-width="1.5" />

  <!-- cars on the horizontal section -->
  <g transform="translate(90,248)">
    <rect x="-17" y="-8" width="34" height="16" rx="4" fill="#f3f3f3" stroke="#222" stroke-width="1" />
    <rect x="-8" y="-6" width="16" height="9" rx="3" fill="#bfe0ff" opacity="0.9" />
    <circle cx="-11" cy="9" r="3.2" fill="#1a1a1a" />
    <circle cx="11" cy="9" r="3.2" fill="#1a1a1a" />
  </g>
  <g transform="translate(330,274)">
    <rect x="-17" y="-8" width="34" height="16" rx="4" fill="#3fc9c0" stroke="#1a1a1a" stroke-width="1" />
    <rect x="-8" y="-6" width="16" height="9" rx="3" fill="#e8fbff" opacity="0.9" />
    <circle cx="-11" cy="9" r="3.2" fill="#1a1a1a" />
    <circle cx="11" cy="9" r="3.2" fill="#1a1a1a" />
  </g>
  <g transform="translate(610,246)">
    <rect x="-17" y="-8" width="34" height="16" rx="4" fill="#2b2b2b" stroke="#000" stroke-width="1" />
    <rect x="-8" y="-6" width="16" height="9" rx="3" fill="#7fa8d9" opacity="0.9" />
    <circle cx="-11" cy="9" r="3.2" fill="#000" />
    <circle cx="11" cy="9" r="3.2" fill="#000" />
  </g>

  <!-- cars angled along the ramp -->
  <g transform="translate(715,470) rotate(50)">
    <rect x="-17" y="-8" width="34" height="16" rx="4" fill="#f3f3f3" stroke="#222" stroke-width="1" />
    <rect x="-8" y="-6" width="16" height="9" rx="3" fill="#bfe0ff" opacity="0.9" />
    <circle cx="-11" cy="9" r="3.2" fill="#1a1a1a" />
    <circle cx="11" cy="9" r="3.2" fill="#1a1a1a" />
  </g>
  <g transform="translate(560,610) rotate(50)">
    <rect x="-17" y="-8" width="34" height="16" rx="4" fill="#3fc9c0" stroke="#1a1a1a" stroke-width="1" />
    <rect x="-8" y="-6" width="16" height="9" rx="3" fill="#e8fbff" opacity="0.9" />
    <circle cx="-11" cy="9" r="3.2" fill="#1a1a1a" />
    <circle cx="11" cy="9" r="3.2" fill="#1a1a1a" />
  </g>
  <g transform="translate(390,750) rotate(50)">
    <rect x="-17" y="-8" width="34" height="16" rx="4" fill="#f3f3f3" stroke="#222" stroke-width="1" />
    <rect x="-8" y="-6" width="16" height="9" rx="3" fill="#bfe0ff" opacity="0.9" />
    <circle cx="-11" cy="9" r="3.2" fill="#1a1a1a" />
    <circle cx="11" cy="9" r="3.2" fill="#1a1a1a" />
  </g>
</svg>
